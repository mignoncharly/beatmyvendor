server {
    listen 80;
    listen [::]:80;
    server_name beatmyvendor.com www.beatmyvendor.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/beatmyvendor-certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://beatmyvendor.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.beatmyvendor.com;

    ssl_certificate /etc/letsencrypt/live/beatmyvendor.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/beatmyvendor.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://beatmyvendor.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name beatmyvendor.com;

    ssl_certificate /etc/letsencrypt/live/beatmyvendor.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/beatmyvendor.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 11m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
}
